name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh --zip

      - name: Translation coverage (informational)
        run: python3 scripts/check-l10n.py ru

      - uses: actions/upload-artifact@v4
        with:
          name: Blinky
          path: build/Blinky-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Blinky-*.zip --title "Blinky $GITHUB_REF_NAME" --generate-notes
